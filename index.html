<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Assign</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--app:#eef0f3;--card:#ffffff;--ink:#23272b;--mut:#8a9099;--line:#dfe2e6;--acc:#2f6b57;--sel:#30343a}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
 background:var(--app);color:var(--ink);overflow:hidden;font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}

/* ── 상단바 ── */
#top{height:52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px}
#logo{font-size:18px;font-weight:900;letter-spacing:.3px;margin-right:6px}
.grp{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.grp button{background:#fff;border:0;border-right:1px solid var(--line);padding:7px 14px;font-size:13px;font-weight:700;color:#555}
.grp button:last-child{border-right:0}
.grp button.on{background:var(--sel);color:#fff}
.spacer{flex:1}
.cpick{display:flex;align-items:center;gap:5px;font-size:12px;color:#555;font-weight:700}
.cpick input{width:30px;height:24px;border:1px solid var(--line);border-radius:6px;padding:1px;background:#fff;cursor:pointer}
.tbtn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:700;color:#333}
.tbtn:hover{background:#f4f5f7}
#saveDot{font-size:11px;color:var(--mut);min-width:52px;text-align:right}

/* ── 무대 / 분할 ── */
#stage{height:calc(100% - 52px)}
#pool{display:none}
#panes{display:grid;height:100%;gap:10px;padding:10px}
body[data-mode=one] #panes{grid-template-columns:1fr;grid-template-rows:1fr}
body[data-mode=two] #panes{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
body[data-mode=four] #panes{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.pane{display:flex;flex-direction:column;min-height:0}
.pbar{flex:none;display:flex;gap:6px;padding:0 2px 6px;align-items:center}
.psel{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;font-weight:700;background:#fff;color:#333}
.pbtn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;color:#555}
.pbtn:hover{background:#f4f5f7}
.pexit{display:none;background:var(--sel);color:#fff;border-color:var(--sel)}
.pbody{flex:1;min-height:0;position:relative}
.pbody .empty{height:100%;border:1px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px}

/* 개별 전체화면 */
body.focusing #top{display:none}
body.focusing #stage{height:100%}
body.focusing .pane:not(.focus){visibility:hidden}
.pane.focus{position:fixed;inset:0;z-index:300;padding:10px;background:var(--app)}
.pane:fullscreen{padding:10px;background:var(--app)}
.pane.focus .pexit,.pane:fullscreen .pexit{display:inline-block}
.pane.focus .pfull,.pane:fullscreen .pfull{display:none}

/* ── 위젯 공통 ── */
.widget{background:var(--card);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;overflow:hidden;height:100%}
.wh{display:flex;align-items:center;padding:10px 12px 8px;flex:none;flex-wrap:wrap;gap:6px}
.wh h2{font-size:14px;font-weight:800}
.wtools{margin-left:auto;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.wb{flex:1;min-height:0;overflow:auto;padding:0 12px 12px;display:flex;flex-direction:column}
.ib{background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:12px;font-weight:700;color:#555}
.ib:hover{background:#f4f5f7}
.ib.on{background:var(--acc);border-color:var(--acc);color:#fff}
.prime{background:var(--sel);color:#fff;border:0;border-radius:8px;padding:7px 14px;font-weight:800;font-size:13px}
.prime:hover{background:#000}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0;font-size:12px;color:#555}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line);border-radius:7px;padding:5px 7px;font-size:12px;background:#fff;color:var(--ink)}
textarea{resize:vertical;width:100%}
.num{width:56px}.num2{width:70px}
.lbl{font-size:12px;color:#555;font-weight:700;display:block;margin-bottom:4px}

/* ── 알림장 ── */
.ntools{display:flex;align-items:center;gap:3px;flex-wrap:wrap;padding-bottom:7px;border-bottom:1px solid var(--line);flex:none}
.ntools button,.cwrap{background:#fff;border:1px solid var(--line);border-radius:7px;height:28px;padding:0 8px;font-size:12px;font-weight:700;color:#555;position:relative;display:inline-flex;align-items:center}
.ntools button:hover,.cwrap:hover{background:#f4f5f7}
.cwrap input{position:absolute;inset:0;opacity:0;cursor:pointer}
.note-wrap{position:relative;flex:1;min-height:0;margin-top:8px}
#noteArea{height:100%;overflow:auto;outline:none;font-size:15px;line-height:1.8;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--card)}
#noteArea:empty::before{content:'알림장을 입력하세요';color:#b6bbc2}
#noteArea h3{font-size:1.05em;margin:2px 0 6px}
.noteCanvas{position:absolute;inset:0;display:none;touch-action:none;z-index:5}
#nDrawBar{position:absolute;top:6px;right:6px;z-index:6;background:#30343a;color:#fff;border-radius:8px;padding:5px 8px;display:flex;gap:5px;align-items:center}
#nDrawBar .ib{background:transparent;color:#fff;border-color:#555}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.6);cursor:pointer;flex:none}
.dot.on{outline:2px solid #fff}

/* ── 보드 ── */
.board-body{position:relative;margin:0 2px 2px;padding:0}
#boardCanvas{position:absolute;inset:0;touch-action:none;cursor:crosshair}
.bcol{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);cursor:pointer;flex:none}
.bcol.on{outline:2px solid var(--sel);outline-offset:1px}

/* ── 시간표 ── */
.ttwrap{flex:1;overflow:auto}
#ttTable{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
#ttTable th,#ttTable td{border:1px solid var(--line);padding:5px 4px;height:34px;text-align:center;overflow:hidden;white-space:nowrap}
#ttTable th{background:#f6f7f8;font-size:11px}
#ttTable td[contenteditable]{outline:none;cursor:text}
#ttTable td[contenteditable]:focus{background:#fffbe8;box-shadow:inset 0 0 0 2px var(--acc)}
td.nowc,th.nowc{background:#fff3c9}
td.nowp{outline:2px solid #e07b39;outline-offset:-2px}

/* ── 달력 ── */
.cal-dow,#calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-dow span{text-align:center;font-size:10px;font-weight:800;color:#999;padding:2px 0}
.cal-dow span:first-child{color:#d05252}.cal-dow span:last-child{color:#4a72b8}
.cday{min-height:34px;border:1px solid transparent;border-radius:6px;font-size:11px;padding:2px 3px;cursor:pointer;overflow:hidden}
.cday:hover{background:#f4f5f7}
.cday b{font-size:10px}
.cday.today{background:#fff3c9;font-weight:800}
.cday.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.cday.has b::after{content:' *';color:#e07b39;font-weight:900}
.cday .cm{display:block;font-size:9px;color:#777;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cday.empty{cursor:default}
.cal-memo{margin-top:auto;border-top:1px solid var(--line);padding-top:7px}
.cal-memo b{font-size:12px}

/* ── 날씨 / 시계 ── */
.wx-body{flex-direction:row;align-items:center;gap:18px;flex-wrap:wrap}
#wxTemp{font-size:38px;font-weight:900;font-variant-numeric:tabular-nums;display:block}
#wxDesc{font-size:13px;color:#666}
#wxSub{font-size:12px;color:#555;line-height:1.7}
.wx-set{margin-left:auto}
.clk-top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
#clkTime{font-size:42px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-1px}
#clkDate{font-size:13px;color:#666}
.tm-zone{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
#tmDisp{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
#tmDisp.done{color:#d0342c;animation:blink .5s steps(2) infinite}
@keyframes blink{to{opacity:.2}}
#tmBar{height:6px;background:#eceef0;border-radius:3px;overflow:hidden;flex:1;min-width:80px}
#tmBar i{display:block;height:100%;background:var(--acc);width:0%}
.chip{background:#f4f5f7;border:1px solid var(--line);border-radius:20px;padding:3px 12px;font-size:11px;font-weight:700}
.chip:hover{background:#e8eaed}

/* ── 뽑기 / 자리 ── */
.tabs{display:flex;gap:4px;margin-bottom:8px;flex:none}
.tabs button{flex:1;border:1px solid var(--line);background:#f4f5f7;border-radius:8px;padding:6px;font-size:12px;font-weight:800;color:#555}
.tabs button.on{background:var(--sel);color:#fff;border-color:var(--sel)}
#pkResult{min-height:56px;display:flex;align-items:center;justify-content:center;font-weight:900;text-align:center;flex-wrap:wrap;gap:6px}
#pkResult.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
#pkGroups{font-size:12px;line-height:2}
#pkGroups b{margin-right:4px}
.podium{background:#30343a;color:#fff;text-align:center;border-radius:6px;padding:5px;font-size:11px;font-weight:800;letter-spacing:8px;margin:8px 0}
#seatGrid{display:grid;gap:6px;align-content:start}
.seat{background:#f6f7f8;border:1px solid var(--line);border-radius:8px;padding:7px 3px;text-align:center;font-size:13px;font-weight:800;min-height:38px;display:flex;align-items:center;justify-content:center;animation:pop .3s;font-variant-numeric:tabular-nums}
.seat.empty{color:#c3c8cd;font-weight:400}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cfd3d8;border-radius:4px}
</style>
</head>
<body data-mode="one">

<header id="top">
  <b id="logo">Assign</b>
  <div class="grp" id="modeGrp">
    <button data-mode="one" class="on">전체화면</button>
    <button data-mode="two">2분할</button>
    <button data-mode="four">4분할</button>
  </div>
  <div class="spacer"></div>
  <label class="cpick">배경 <input type="color" id="appBg" value="#eef0f3" title="프로그램 배경색"></label>
  <label class="cpick">위젯 <input type="color" id="cardBg" value="#ffffff" title="위젯(카드) 배경색"></label>
  <button class="tbtn" id="btnExport" title="알림장 내용을 텍스트 파일로 저장">알림장 내보내기</button>
  <span id="saveDot">자동저장</span>
</header>

<main id="stage">
<div id="pool">

  <!-- 알림장 -->
  <section class="widget" data-w="note" id="w_note">
    <header class="wh"><h2>알림장</h2></header>
    <div class="wb">
      <div class="ntools" id="nTools">
        <button data-cmd="bold" title="선택 문자 굵게">굵게</button>
        <button data-cmd="underline" title="선택 문자 밑줄">밑줄</button>
        <button data-cmd="strikeThrough" title="선택 문자 취소선">취소선</button>
        <button id="btnHl" title="선택 문자 형광펜, 다시 누르면 해제">형광펜</button>
        <label class="cwrap" title="선택 문자 글자색">글자색<input type="color" id="fgIn" value="#c0392b"></label>
        <button data-fz="1" title="글씨 확대">확대</button>
        <button data-fz="-1" title="글씨 축소">축소</button>
        <button data-cmd="insertUnorderedList" title="목록">목록</button>
        <button id="btnDate" title="오늘 날짜 제목 넣기">날짜</button>
        <button id="btnDraw" title="손글씨 그리기 모드">손글씨</button>
        <button id="btnCopy" title="알림장 전체 복사">복사</button>
      </div>
      <div class="note-wrap">
        <div id="noteArea" contenteditable="true" spellcheck="false"></div>
        <canvas id="noteCanvas" class="noteCanvas"></canvas>
        <div id="nDrawBar" class="hide"></div>
      </div>
    </div>
  </section>

  <!-- 보드 -->
  <section class="widget" data-w="board" id="w_board">
    <header class="wh"><h2>보드</h2><div class="wtools" id="bTools"></div></header>
    <div class="wb board-body"><canvas id="boardCanvas"></canvas></div>
  </section>

  <!-- 시간표 -->
  <section class="widget" data-w="tt" id="w_tt">
    <header class="wh"><h2>시간표</h2>
      <div class="wtools"><select id="ttSlot"></select><button class="ib" id="ttRename">이름 바꾸기</button></div>
    </header>
    <div class="wb"><div class="ttwrap" id="ttWrap"></div></div>
  </section>

  <!-- 랜덤 뽑기 -->
  <section class="widget" data-w="picker" id="w_picker">
    <header class="wh"><h2>랜덤 뽑기</h2></header>
    <div class="wb">
      <div class="tabs">
        <button id="tabPick" class="on">뽑기</button><button id="tabSeat">자리바꾸기</button>
      </div>
      <div id="panePick">
        <label class="lbl">추첨 대상 (번호 또는 이름, 쉼표나 줄바꿈으로 구분)</label>
        <textarea id="pkNames" rows="3" placeholder="예) 1, 2, 3, 4, 5"></textarea>
        <div class="row">
          <button id="btnPickOne" class="prime">1개 뽑기</button>
          <input id="pkCnt" type="number" min="1" value="2" class="num">
          <button id="btnPickN" class="ib">개수만큼 뽑기</button>
        </div>
        <div class="row">
          모둠 수 <input id="pkGn" type="number" min="2" max="12" value="4" class="num">
          <button id="btnPickGroup" class="ib">모둠 짜기</button>
        </div>
        <div id="pkResult"></div><div id="pkGroups"></div>
      </div>
      <div id="paneSeat" class="hide">
        <div class="row">분단(열) 수 <input id="seatCols" type="number" min="2" max="8" value="4" class="num">
          <button id="btnSeat" class="prime">자리 배치</button></div>
        <div class="podium">강 단</div><div id="seatGrid"></div>
      </div>
    </div>
  </section>

  <!-- 달력 -->
  <section class="widget" data-w="cal" id="w_cal">
    <header class="wh"><h2>달력</h2>
      <div class="wtools">
        <button class="ib" id="calPrev">이전</button><b id="calTitle" style="font-size:12px"></b>
        <button class="ib" id="calNext">다음</button><button class="ib" id="calToday">오늘</button>
      </div>
    </header>
    <div class="wb">
      <div class="cal-dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
      <div id="calGrid"></div>
      <div class="cal-memo">
        <b id="calSelDate">날짜를 클릭하면 메모할 수 있습니다</b>
        <textarea id="calMemo" rows="2" placeholder="행사, 과제, 준비물 메모"></textarea>
        <div class="row"><button class="ib" id="calSave">저장</button><button class="ib" id="calDel">삭제</button></div>
      </div>
    </div>
  </section>

  <!-- 시계 / 타이머 -->
  <section class="widget" data-w="clock" id="w_clock">
    <header class="wh"><h2>시계 / 타이머</h2></header>
    <div class="wb">
      <div class="clk-top"><span id="clkTime">--:--:--</span><span id="clkDate"></span></div>
      <div class="tm-zone">
        <div class="row">
          <button class="chip" data-m="1">1분</button><button class="chip" data-m="5">5분</button>
          <button class="chip" data-m="10">10분</button>
          <input id="tmMin" type="number" min="0.1" step="0.5" value="5" class="num"><span>분</span>
          <button class="prime" id="tmToggle">시작</button><button class="ib" id="tmReset">초기화</button>
        </div>
        <div class="row"><span id="tmDisp">05:00</span><div id="tmBar"><i></i></div></div>
      </div>
    </div>
  </section>

  <!-- 날씨 -->
  <section class="widget" data-w="wx" id="w_wx">
    <header class="wh"><h2>날씨</h2>
      <div class="wtools"><button class="ib" id="wxHere">현재 위치 조회</button></div>
    </header>
    <div class="wb wx-body">
      <div><b id="wxTemp">--</b><span id="wxDesc">현재 위치 조회 또는 좌표 입력</span></div>
      <div id="wxSub"></div>
      <div class="row wx-set">위도 <input id="wxLat" type="text" class="num2" placeholder="37.56">
        경도 <input id="wxLon" type="text" class="num2" placeholder="126.97">
        <button class="ib" id="wxLoad">조회</button></div>
    </div>
  </section>

</div><!-- /pool -->

<div id="panes"></div>
</main>

<script>
"use strict";
const $=s=>document.querySelector(s), KEY='assign_v2';
const WIDGETS=[
 {id:'note',title:'알림장'},{id:'board',title:'보드'},{id:'tt',title:'시간표'},
 {id:'picker',title:'랜덤 뽑기'},{id:'cal',title:'달력'},{id:'clock',title:'시계 / 타이머'},{id:'wx',title:'날씨'}];
const MODE_N={one:1,two:2,four:4};

/* ── 상태 & 저장 ── */
const DEF={ver:2,view:{mode:'one',panes:['','','','']},ui:{app:'#eef0f3',card:'#ffffff'},
 note:{html:'',draw:null,fz:3},board:{draw:null},
 tt:{cur:0,slots:[1,2,3].map(i=>({name:'시간표 '+i,cells:Array(35).fill('')}))},
 cal:{},picker:{names:'',seats:{cols:4},seatMap:[]},wx:{lat:null,lon:null}};
let state=DEF;
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.ver===2)state=Object.assign({},DEF,s);}catch(e){}
let saveT=null;
function scheduleSave(){clearTimeout(saveT);$('#saveDot').textContent='저장 중';
 saveT=setTimeout(()=>{localStorage.setItem(KEY,JSON.stringify(state));$('#saveDot').textContent='자동저장';},400);}
const download=(name,data,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();};

/* ── 분할 구성 (플러그인 슬롯) ── */
const panesRoot=$('#panes'),pool=$('#pool'),paneEls=[];
for(let i=0;i<4;i++){
 const p=document.createElement('div');p.className='pane';
 p.innerHTML=`<div class="pbar">
   <select class="psel"><option value="">위젯 선택</option>${WIDGETS.map(w=>`<option value="${w.id}">${w.title}</option>`).join('')}</select>
   <button class="pbtn pclear">지우기</button>
   <button class="pbtn pfull">전체화면</button>
   <button class="pbtn pexit">전체화면 나가기</button></div><div class="pbody"></div>`;
 panesRoot.append(p);
 const sel=p.querySelector('.psel'),body=p.querySelector('.pbody');
 paneEls.push({el:p,sel,body});
 sel.onchange=()=>{const old=state.view.panes[i],val=sel.value;
  const j=state.view.panes.indexOf(val);
  if(val&&j>-1&&j!==i)state.view.panes[j]=old; // 이미 다른 칸에 있으면 맞바꿈
  state.view.panes[i]=val;layout();scheduleSave();requestAnimationFrame(fitAll);};
 p.querySelector('.pclear').onclick=()=>{state.view.panes[i]='';layout();scheduleSave();};
 p.querySelector('.pfull').onclick=()=>focusPane(p);
 p.querySelector('.pexit').onclick=()=>unfocus();}
function layout(){
 WIDGETS.forEach(w=>pool.appendChild($('#w_'+w.id)));
 const n=MODE_N[state.view.mode],used=new Set();
 paneEls.forEach((P,i)=>{
  P.el.style.display=i<n?'':'none';if(i>=n)return;
  let id=state.view.panes[i];if(id&&used.has(id)){id='';state.view.panes[i]='';}
  P.body.innerHTML='';
  if(id){used.add(id);P.body.appendChild($('#w_'+id));}
  else{const e=document.createElement('div');e.className='empty';e.textContent='위젯을 선택하세요';P.body.appendChild(e);}
  P.sel.value=id||'';});}
function setMode(m){state.view.mode=m;document.body.dataset.mode=m;

function makeLayer(cv,activeDefault){
 const ctx=cv.getContext('2d');
 const L={cv,color:'#23272b',size:4,erase:false,undo:[],active:!!activeDefault,onSave:null};
 function fit(){const r=cv.parentElement.getBoundingClientRect(),w=Math.floor(r.width),h=Math.floor(r.height);
  if(w<10||h<10)return;const dpr=devicePixelRatio||1,old=cv.width?cv.toDataURL():null;
  cv.width=w*dpr;cv.height=h*dpr;cv.style.width=w+'px';cv.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(old){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,w,h);im.src=old;}}
 let last=null;
 const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
 function seg(p){ctx.save();ctx.lineCap=ctx.lineJoin='round';
  if(L.erase){ctx.globalCompositeOperation='destination-out';ctx.lineWidth=L.size*3;}
  else{ctx.strokeStyle=L.color;ctx.lineWidth=L.size;}
  ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0]+.01,p[1]+.01);ctx.stroke();ctx.restore();last=p;}
 cv.addEventListener('pointerdown',e=>{if(!L.active)return;cv.setPointerCapture(e.pointerId);
  L.undo.push(cv.toDataURL());if(L.undo.length>12)L.undo.shift();last=pos(e);seg(last);});
 cv.addEventListener('pointermove',e=>{if(last)seg(pos(e));});
 ['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{if(last){last=null;L.onSave&&L.onSave();}}));
 L.undoFn=()=>{const u=L.undo.pop();if(!u)return;const im=new Image();im.onload=()=>{
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);ctx.restore();
  const r=cv.getBoundingClientRect();ctx.drawImage(im,0,0,r.width,r.height);L.onSave&&L.onSave();};im.src=u;};
 L.clear=()=>{L.undo.push(cv.toDataURL());const r=cv.getBoundingClientRect();ctx.clearRect(0,0,r.width,r.height);L.onSave&&L.onSave();};
 L.load=data=>{if(!data)return;const im=new Image();im.onload=()=>{const r=cv.getBoundingClientRect();if(r.width>0)ctx.drawImage(im,0,0,r.width,r.height);};im.src=data;};
 L.fit=fit;return L;}

function paintCell(td){const t=td.textContent.trim();if(!t){td.style.background='';td.style.borderLeft='';return;}
 const h=hashHue(t);td.style.background=`hsl(${h} 65% 92%)`;td.style.borderLeft=`3px solid hsl(${h} 50% 65%)`;}
function buildTT(){const slot=curSlot();
 let h='<table id="ttTable"><thead><tr><th style="width:46px">교시</th>'+DAYS.map(d=>`<th data-dow="${d}">${d}</th>`).join('')+'</tr></thead><tbody>';
 for(let p=0;p<7;p++){h+=`<tr data-p="${p}"><th>${p+1}</th>`;
  for(let d=0;d<5;d++)h+=`<td contenteditable="true" data-i="${d*7+p}">${slot.cells[d*7+p]||''}</td>`;h+='</tr>';}
 $('#ttWrap').innerHTML=h+'</tbody></table>';
 $('#ttWrap').querySelectorAll('td[contenteditable]').forEach(td=>{paintCell(td);
  td.addEventListener('input',()=>{curSlot().cells[+td.dataset.i]=td.textContent;paintCell(td);scheduleSave();});});
 ttNow();}

 const n=new Date(),dw=n.getDay();if(dw<1||dw>5)return;
 const nowM=n.getHours()*60+n.getMinutes();let p=-1;
 PT.forEach(([s,e],i)=>{const[a,b]=[s,e].map(t=>{const[h,m]=t.split(':').map(Number);return h*60+m;});if(nowM>=a&&nowM<b)p=i;});

 [0,.28,.56].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;
 const s=c.currentTime+t;g.gain.setValueAtTime(.001,s);g.gain.exponentialRampToValueAtTime(.4,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.25);o.start(s);o.stop(s+.26);});}catch(e){}}
